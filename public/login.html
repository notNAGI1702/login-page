<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // If an active session token exists, don't let them log in again
      if (localStorage.getItem("sessionToken")) {
        window.location.href = "/homepage";
      }
    </script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/login.css" />
    <title>Login Page</title>
  </head>
  <body>
    <div
      class="min-h-screen bg-cover bg-center bg-no-repeat bg-[url('/assets/Login_background.jpg')] flex items-center justify-center p-4"
    >
      <div
        class="w-full max-w-md bg-white/10 border border-white/20 rounded-2xl p-8 shadow-2xl backdrop-blur-[20px]"
      >
        <form class="flex flex-col space-y-6">
          <h1
            class="text-3xl font-bold text-white text-center tracking-wide drop-shadow-md"
          >
            Welcome
          </h1>

          <div class="relative flex items-center">
            <i class="fa-solid fa-user absolute left-4 text-slate-300"></i>
            <input
              type="text"
              name="username"
              id="username"
              placeholder="Username"
              required
              class="w-full bg-white/10 border border-white/20 rounded-xl py-3 pl-11 pr-4 text-white placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:bg-white/20 transition duration-200"
            />
          </div>

          <div class="relative flex items-center">
            <i class="fa-solid fa-lock absolute left-4 text-slate-300"></i>
            <input
              type="password"
              name="password"
              id="password"
              placeholder="Password"
              required
              class="w-full bg-white/10 border border-white/20 rounded-xl py-3 pl-11 pr-4 text-white placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:bg-white/20 transition duration-200"
            />
          </div>

          <button
            type="submit"
            class="w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-semibold py-3 rounded-xl shadow-lg hover:shadow-orange-500/20 active:scale-[0.98] transition-all duration-200"
          >
            Login
          </button>
        </form>
      </div>
    </div>

    <script src="/js/login.js"></script>
  </body>
</html>
